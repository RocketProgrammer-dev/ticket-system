; Deployment configuration for the Ticket System client.
;
; This file must sit in the same folder as TicketApp.exe. The installer
; writes it; on Windows it lands under Program Files, which ordinary users
; cannot modify - so the server address is fixed at install time and no user
; can repoint the client at a different machine.
;
; Read once at startup. Restart the application after changing it.

[Server]
; Address of the API. Use the server's hostname or IP address, not localhost,
; unless the API runs on the same machine as the client.
Url=http://ticket-server:5000
